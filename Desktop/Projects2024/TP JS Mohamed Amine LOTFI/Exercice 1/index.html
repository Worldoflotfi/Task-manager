<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Animation Controls</title>
</head>
<body>
  
  <div class="container">
    <!-- Section des contrôles -->
    <div class="controls">
      <h1>Paramètres</h1>
      <label>Couleur du calque :
        <input id="layerColor" type="color" value="#007BFF">
      </label>
      <label>Largeur :
        <input id="layerWidth" type="number" placeholder="100" min="50">
      </label>
      <label>Hauteur :
        <input id="layerHeight" type="number" placeholder="100" min="50">
      </label>
      <label>Texte :
        <input id="layerText" type="text" placeholder="Calque">
      </label>
      <label>Transparence :
        <input id="layerOpacity" type="range" min="0.1" max="1" step="0.1" value="1">
      </label>
      <h2>Animation</h2>
      <label>Direction horizontale :
        <select id="horizontalDirection">
          <option value="right">Droite</option>
          <option value="left">Gauche</option>
        </select>
      </label>
      <label>Direction verticale :
        <select id="verticalDirection">
          <option value="down">Bas</option>
          <option value="up">Haut</option>
        </select>
      </label>
      <label>Trajectoire :
        <select id="trajectory">
          <option value="horizontal">Horizontal</option>
          <option value="vertical">Vertical</option>
          <option value="diagonal">Diagonal</option>
        </select>
      </label>
      <button id="startAnimation">Démarrer l'animation</button>
    </div>

    <!-- Aire d'animation -->
    <div class="animation-area">
      <div id="layer">Calque</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
