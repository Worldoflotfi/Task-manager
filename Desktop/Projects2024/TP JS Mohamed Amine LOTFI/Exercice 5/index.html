<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculatrice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calculator {
      width: 300px;
      background-color: #000;
      border-radius: 25px;
      overflow: hidden;
    }

    .display {
      padding: 20px;
      background-color: #333;
      font-size: 32px;
      text-align: right;
      color: #fff;
      border-bottom: 1px solid #444;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background-color: #444;
    }

    button {
      padding: 20px;
      font-size: 22px;
      border: none;
      outline: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: all 0.3s;
    }

    button.number {
      background-color: #505050;
    }

    button.number:hover {
      background-color: #6e6e6e;
    }

    button.operator {
      background-color: #ff9500;
    }

    button.operator:hover {
      background-color: #cc7600;
    }

    button.function {
      background-color: #d4d4d2;
      color: #000;
    }

    button.function:hover {
      background-color: #bdbdbb;
    }

    button.equal {
      background-color: #ff9500;
      grid-column: span 4;
    }

    button.equal:hover {
      background-color: #cc7600;
    }

    button.clear {
      background-color: #d4d4d2;
      color: #000;
    }

    button.clear:hover {
      background-color: #bdbdbb;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="function" onclick="clearDisplay()">C</button>
    <button class="function" onclick="calculatePercentage()">%</button>
    <button class="function" onclick="calculateSquareRoot()">√</button>
    <button class="operator" onclick="setOperation('/')">÷</button>

    <button class="number" onclick="appendNumber('7')">7</button>
    <button class="number" onclick="appendNumber('8')">8</button>
    <button class="number" onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="setOperation('*')">×</button>

    <button class="number" onclick="appendNumber('4')">4</button>
    <button class="number" onclick="appendNumber('5')">5</button>
    <button class="number" onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="setOperation('-')">−</button>

    <button class="number" onclick="appendNumber('1')">1</button>
    <button class="number" onclick="appendNumber('2')">2</button>
    <button class="number" onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="setOperation('+')">+</button>

    <button class="number" onclick="appendNumber('0')">0</button>
    <button class="number" onclick="appendNumber('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let currentInput = '0';
  let previousInput = '';
  let operation = null;

  const display = document.getElementById('display');

  function updateDisplay() {
    display.textContent = currentInput;
  }

  function appendNumber(number) {
    if (currentInput === '0' && number !== '.') {
      currentInput = number;
    } else {
      currentInput += number;
    }
    updateDisplay();
  }

  function setOperation(op) {
    if (operation !== null) {
      calculate();
    }
    previousInput = currentInput;
    currentInput = '0';
    operation = op;
  }

  function calculate() {
    if (operation === null || previousInput === '') return;

    const prev = parseFloat(previousInput);
    const curr = parseFloat(currentInput);

    if (isNaN(prev) || isNaN(curr)) return;

    switch (operation) {
      case '+':
        currentInput = (prev + curr).toString();
        break;
      case '-':
        currentInput = (prev - curr).toString();
        break;
      case '*':
        currentInput = (prev * curr).toString();
        break;
      case '/':
        currentInput = curr !== 0 ? (prev / curr).toString() : 'Erreur';
        break;
      default:
        return;
    }

    operation = null;
    previousInput = '';
    updateDisplay();
  }

  function calculateSquareRoot() {
    const curr = parseFloat(currentInput);
    if (isNaN(curr)) return;
    currentInput = Math.sqrt(curr).toString();
    updateDisplay();
  }

  function calculatePercentage() {
    const curr = parseFloat(currentInput);
    if (isNaN(curr)) return;
    currentInput = (curr / 100).toString();
    updateDisplay();
  }

  function clearDisplay() {
    currentInput = '0';
    previousInput = '';
    operation = null;
    updateDisplay();
  }
</script>

</body>
</html>
